name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 为什么装两个：SDK 版本由仓库根的 global.json 定（10.0.x，slnx 解决方案格式需要它），
      # 而测试与站点都 target net8.0，跑起来需要 8.0 的运行时 —— 用 8.0.x 这一档把它装上。
      - name: 安装 .NET SDK（构建用 10.0.x，运行测试用 8.0.x）
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Release 构建：0 警告是硬门禁 —— Directory.Build.props 里 TreatWarningsAsErrors=true，
      # 多出一个告警这一步就红（需要临时放行时用 WarningsNotAsErrors 逐条列出，不要整体放宽）。
      # 构建盖章（1.1.0+<提交>）也在这里生效：CI 有 GITHUB_SHA，产物因此带着提交号，
      # 现场用 deploy\verify.ps1 就能核对"装的是哪次提交"。
      - name: 还原并构建
        run: dotnet build DataTrace.slnx -c Release --nologo

      - name: 单元与集成测试
        run: dotnet test tests/DataTrace.Tests/DataTrace.Tests.csproj -c Release --no-build --nologo

      - name: 组件测试（bUnit）
        run: dotnet test tests/DataTrace.Web.Tests/DataTrace.Web.Tests.csproj -c Release --no-build --nologo

      # E2E 会自己拉起一个隔离的 DataTrace.Web 实例；默认只认 Debug 产物路径，
      # 所以这里显式告诉它用刚构建出来的 Release 应用。
      - name: E2E（Playwright 驱动 windows-latest 自带的 msedge）
        run: dotnet test tests/DataTrace.E2E.Tests/DataTrace.E2E.Tests.csproj -c Release --no-build --nologo
        env:
          DATATRACE_APP_DLL: ${{ github.workspace }}\src\DataTrace.Web\bin\Release\net8.0\DataTrace.Web.dll
          # auto：像素比对只在"基线存在且录制环境指纹与本机一致"时才做，否则退化成
          # "验截得出图"。现有基线录自开发机的 Edge，runner 上浏览器版本不同，
          # 强行 compare 只会抖出一屏假红。想在 CI 上做真比对：在 windows-latest 上以
          # DATATRACE_E2E_GOLDEN=update 跑一次并提交 golden/（含 environment.json），
          # 之后 auto 会自动升级成比对，不需要再改这一行。
          DATATRACE_E2E_GOLDEN: auto
