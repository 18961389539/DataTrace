name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # SDK 版本由仓库根的 global.json 固定（8.0.4xx，latestFeature）——构建与运行都在 .NET 8 一档。
      # 仓库曾用 slnx + 10.0.x 构建的组合；slnx 需要 9.0.200+ 的 MSBuild，为把 SDK 钉回 8 已回退为 .sln。
      - name: 安装 .NET SDK（8.0.x，与 global.json 一致）
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      # Release 构建：0 警告是硬门禁 —— Directory.Build.props 里 TreatWarningsAsErrors=true，
      # 多出一个告警这一步就红（需要临时放行时用 WarningsNotAsErrors 逐条列出，不要整体放宽）。
      # 构建盖章（1.1.0+<提交>）也在这里生效：CI 有 GITHUB_SHA，产物因此带着提交号，
      # 现场用 deploy\verify.ps1 就能核对"装的是哪次提交"。
      - name: 还原并构建
        run: dotnet build DataTrace.sln -c Release --nologo

      - name: 安装 Playwright 锁定版本 Chromium
        run: pwsh tests\DataTrace.E2E.Tests\bin\Release\net8.0\playwright.ps1 install chromium

      - name: 单元与集成测试
        run: dotnet test tests/DataTrace.Tests/DataTrace.Tests.csproj -c Release --no-build --nologo --filter "Category!=Performance" --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results/unit

      - name: 隔离合成数据备份停顿基准
        run: dotnet test tests/DataTrace.Tests/DataTrace.Tests.csproj -c Release --no-build --nologo --filter FullyQualifiedName~Synthetic_backup_records_real_maintenance_and_waiting_read_durations
        env:
          DATATRACE_BACKUP_BENCHMARK_BYTES: 8388608
          DATATRACE_BACKUP_BENCHMARK_FILES: 4
          DATATRACE_BACKUP_BENCHMARK_OUTPUT: ${{ github.workspace }}\artifacts\backup-benchmark\measurement.json

      - name: 查询规模性能基准
        run: pwsh -File tests\benchmarks\run-query-performance.ps1 -RowsPerMonth 10000 -PageSize 500 -DeepSkip 10000

      - name: 组件测试（bUnit）
        run: dotnet test tests/DataTrace.Web.Tests/DataTrace.Web.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=components.trx" --results-directory artifacts/test-results/components

      # E2E 会自己拉起一个隔离的 DataTrace.Web 实例；默认只认 Debug 产物路径，
      # 所以这里显式告诉它用刚构建出来的 Release 应用。
      - name: E2E（Playwright 锁定版本 Chromium）
        run: dotnet test tests/DataTrace.E2E.Tests/DataTrace.E2E.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=e2e.trx" --results-directory artifacts/test-results/e2e
        env:
          DATATRACE_APP_DLL: ${{ github.workspace }}\src\DataTrace.Web\bin\Release\net8.0\DataTrace.Web.dll
          DATATRACE_E2E_BROWSER: chromium
          DATATRACE_E2E_GOLDEN: compare
          DATATRACE_E2E_ARTIFACTS_DIR: ${{ github.workspace }}\artifacts\e2e

      - name: 发布部署验收包
        run: pwsh deploy\publish.ps1 -Output ${{ github.workspace }}\artifacts\deploy-publish

      - name: 隔离部署、升级、备份与回滚验收
        run: pwsh deploy\acceptance-isolated.ps1 -PublishDir ${{ github.workspace }}\artifacts\deploy-publish

      - name: 汇总视觉基线状态
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '### Visual baseline results'
          $reportDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\e2e'
          $reports = Get-ChildItem $reportDirectory -Filter '*.json' -ErrorAction SilentlyContinue
          if (-not $reports) {
            Add-Content $env:GITHUB_STEP_SUMMARY 'No visual comparison report was produced.'
          } else {
            foreach ($report in $reports | Sort-Object Name) {
              $result = Get-Content $report.FullName -Raw | ConvertFrom-Json
              Add-Content $env:GITHUB_STEP_SUMMARY ("- ``{0}``: ``{1}``" -f $result.target, $result.status)
            }
          }

      - name: 上传测试报告、截图与 Playwright trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            artifacts/test-results/**/*.trx
            artifacts/backup-benchmark/**
            artifacts/query-benchmark-result-*.txt
            artifacts/e2e/**
          if-no-files-found: ignore
          retention-days: 7
