name: reviewed visual golden recording

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build DataTrace.sln -c Release --nologo
      - name: Install locked Playwright Chromium
        run: pwsh tests\DataTrace.E2E.Tests\bin\Release\net8.0\playwright.ps1 install chromium
      - name: Record visual baselines
        run: dotnet test tests/DataTrace.E2E.Tests/DataTrace.E2E.Tests.csproj -c Release --no-build --nologo --filter FullyQualifiedName~ScreenshotsMatchTheirBaseline
        env:
          DATATRACE_APP_DLL: ${{ github.workspace }}\src\DataTrace.Web\bin\Release\net8.0\DataTrace.Web.dll
          DATATRACE_E2E_BROWSER: chromium
          DATATRACE_E2E_GOLDEN: update
      - name: Upload candidate baselines for human review
        uses: actions/upload-artifact@v4
        with:
          name: visual-golden-candidate
          path: tests/DataTrace.E2E.Tests/golden/
          if-no-files-found: error
          retention-days: 7
